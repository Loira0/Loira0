<svg width="1100" height="620" viewBox="0 0 1100 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gustavo Henrique animated professional showcase</title>
  <desc id="desc">Highly animated visual dashboard for automation, data intelligence, BI, SQL, React and credit recovery operations.</desc>

  <defs>
    <radialGradient id="spotA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="panel" x1="240" y1="74" x2="915" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#020617"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.219 0 0 0 0 0.741 0 0 0 0 0.973 0 0 0 0.75 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.75"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#1e293b" stroke-width="1" opacity="0.58"/>
    </pattern>
    <style>
      .eyebrow { font: 800 12px 'Segoe UI', Arial, sans-serif; fill: #38bdf8; letter-spacing: 1.4px; }
      .hero { font: 900 34px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 600 10.5px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .label { font: 800 13px 'Segoe UI', Arial, sans-serif; fill: #e5e7eb; }
      .metric { font: 900 26px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .chip { font: 800 11px 'Segoe UI', Arial, sans-serif; fill: #dbeafe; }
      .code { font: 500 13px 'Consolas', 'Fira Code', monospace; fill: #dbeafe; }
      .key { fill: #38bdf8; }
      .str { fill: #a7f3d0; }
      .num { fill: #fde68a; }

      .floatA { animation: floatA 5.8s ease-in-out infinite; }
      .floatB { animation: floatB 6.6s ease-in-out infinite; }
      .floatC { animation: floatC 4.8s ease-in-out infinite; }
      .pulse { animation: pulse 2.1s ease-in-out infinite; transform-origin: center; }
      .pulseSlow { animation: pulse 3.6s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 6.2s linear infinite; }
      .dash { stroke-dasharray: 9 11; animation: dash 9s linear infinite; }
      .dashFast { stroke-dasharray: 5 8; animation: dash 4.6s linear infinite; }
      .spin { animation: spin 22s linear infinite; transform-origin: 550px 308px; }
      .spinReverse { animation: spinReverse 30s linear infinite; transform-origin: 550px 308px; }
      .barA { animation: barA 2.8s ease-in-out infinite; transform-origin: bottom; }
      .barB { animation: barB 3.2s ease-in-out infinite; transform-origin: bottom; }
      .barC { animation: barC 2.4s ease-in-out infinite; transform-origin: bottom; }
      .blink { animation: blink 1.05s steps(2) infinite; }
      .flowDot1 { animation: flow1 5.5s linear infinite; }
      .flowDot2 { animation: flow2 6.2s linear infinite; }
      .flowDot3 { animation: flow3 5.8s linear infinite; }
      .wave { animation: wave 4.5s ease-in-out infinite; }
      .fadeCycle { animation: fadeCycle 3.8s ease-in-out infinite; }

      @keyframes floatA { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
      @keyframes floatB { 0%,100%{transform:translateY(0)} 50%{transform:translateY(10px)} }
      @keyframes floatC { 0%,100%{transform:translate(0,0)} 50%{transform:translate(6px,-8px)} }
      @keyframes pulse { 0%,100%{opacity:.55;transform:scale(1)} 50%{opacity:1;transform:scale(1.08)} }
      @keyframes scan { 0%{transform:translateX(-1100px)} 100%{transform:translateX(1100px)} }
      @keyframes dash { to { stroke-dashoffset: -220; } }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes spinReverse { to { transform:rotate(-360deg); } }
      @keyframes barA { 0%,100%{transform:scaleY(.42)} 50%{transform:scaleY(1)} }
      @keyframes barB { 0%,100%{transform:scaleY(.82)} 50%{transform:scaleY(.38)} }
      @keyframes barC { 0%,100%{transform:scaleY(.55)} 50%{transform:scaleY(.92)} }
      @keyframes blink { 0%,45%{opacity:1} 46%,100%{opacity:0} }
      @keyframes flow1 { 0%{transform:translate(0,0);opacity:0} 12%{opacity:1} 100%{transform:translate(296px,86px);opacity:0} }
      @keyframes flow2 { 0%{transform:translate(0,0);opacity:0} 12%{opacity:1} 100%{transform:translate(-264px,110px);opacity:0} }
      @keyframes flow3 { 0%{transform:translate(0,0);opacity:0} 12%{opacity:1} 100%{transform:translate(246px,-118px);opacity:0} }
      @keyframes wave { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
      @keyframes fadeCycle { 0%,100%{opacity:.38} 50%{opacity:1} }
    </style>
  </defs>

  <rect width="1100" height="620" rx="34" fill="url(#bg)"/>
  <rect width="1100" height="620" rx="34" fill="url(#grid)" opacity="0.58"/>
  <circle class="floatA" cx="140" cy="120" r="150" fill="url(#spotA)"/>
  <circle class="floatB" cx="970" cy="520" r="190" fill="url(#spotB)"/>
  <circle class="pulseSlow" cx="948" cy="116" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <circle class="pulse" cx="112" cy="516" r="8" fill="#818cf8" filter="url(#glow)"/>

  <g class="scan" opacity="0.36">
    <rect y="88" width="1100" height="2" fill="url(#scanLine)"/>
    <rect y="542" width="1100" height="2" fill="url(#scanLine)"/>
  </g>

  <g class="spinReverse" opacity="0.58">
    <circle cx="550" cy="308" r="248" stroke="#164e63" stroke-width="1.5" stroke-dasharray="5 12"/>
    <circle cx="550" cy="308" r="186" stroke="#075985" stroke-width="1.2" stroke-dasharray="4 14"/>
  </g>

  <g class="spin" opacity="0.9">
    <circle cx="550" cy="60" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="798" cy="308" r="4" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="550" cy="556" r="5" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="302" cy="308" r="4" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <g transform="translate(58 50)">
    <text class="eyebrow" x="0" y="0">OPERATIONS INTELLIGENCE</text>
    <text class="hero" x="0" y="46">Automation + Data + Dashboards</text>
    <text class="subtitle" x="0" y="78">Solucoes para cobranca, CRM, indicadores, integracoes e decisao operacional.</text>
  </g>

  <g transform="translate(62 158)" class="floatA" filter="url(#softShadow)">
    <rect width="244" height="90" rx="18" fill="#020617" stroke="#0ea5e9"/>
    <text class="tiny" x="22" y="28">OPERACAO</text>
    <text class="metric" x="22" y="61">Cobrança</text>
    <path class="dashFast" d="M24 76H218" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <g transform="translate(62 274)" class="floatB" filter="url(#softShadow)">
    <rect width="244" height="90" rx="18" fill="#020617" stroke="#22d3ee"/>
    <text class="tiny" x="22" y="28">DADOS</text>
    <text class="metric" x="22" y="61">SQL + BI</text>
    <path class="dashFast" d="M24 76H218" stroke="#22d3ee" stroke-width="2"/>
  </g>

  <g transform="translate(62 390)" class="floatC" filter="url(#softShadow)">
    <rect width="244" height="90" rx="18" fill="#020617" stroke="#818cf8"/>
    <text class="tiny" x="22" y="28">AUTOMACAO</text>
    <text class="metric" x="22" y="61">Processos</text>
    <path class="dashFast" d="M24 76H218" stroke="#818cf8" stroke-width="2"/>
  </g>

  <g transform="translate(372 118)" filter="url(#softShadow)">
    <rect width="470" height="350" rx="24" fill="url(#panel)" stroke="#1e40af"/>
    <rect width="470" height="50" rx="24" fill="#0f172a"/>
    <circle cx="30" cy="25" r="6" fill="#ef4444"/>
    <circle cx="52" cy="25" r="6" fill="#f59e0b"/>
    <circle cx="74" cy="25" r="6" fill="#22c55e"/>
    <text class="tiny" x="108" y="30">recovery-ops.control-center</text>

    <g transform="translate(28 78)">
      <rect width="124" height="76" rx="16" fill="#0f172a" stroke="#164e63"/>
      <text class="tiny" x="17" y="24">KPIs</text>
      <text class="metric" x="17" y="55">BI</text>
      <circle class="pulse" cx="104" cy="38" r="10" fill="#38bdf8" filter="url(#glow)"/>

      <rect x="146" width="124" height="76" rx="16" fill="#0f172a" stroke="#164e63"/>
      <text class="tiny" x="163" y="24">FRONT</text>
      <text class="metric" x="163" y="55">React</text>
      <circle class="pulse" cx="250" cy="38" r="10" fill="#22d3ee" filter="url(#glow)"/>

      <rect x="292" width="124" height="76" rx="16" fill="#0f172a" stroke="#164e63"/>
      <text class="tiny" x="309" y="24">INTELIGENCIA</text>
      <text class="metric" x="309" y="55">IA</text>
      <circle class="pulse" cx="396" cy="38" r="10" fill="#818cf8" filter="url(#glow)"/>
    </g>

    <g transform="translate(34 188)">
      <text class="tiny" x="0" y="0">LIVE PERFORMANCE PIPELINE</text>
      <path class="dash" d="M0 54C56 12 92 96 148 54S240 12 296 54S366 96 404 40" stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle class="pulse" cx="0" cy="54" r="6" fill="#38bdf8"/>
      <circle class="pulse" cx="148" cy="54" r="6" fill="#22d3ee"/>
      <circle class="pulse" cx="296" cy="54" r="6" fill="#818cf8"/>
      <circle class="pulse" cx="404" cy="40" r="6" fill="#38bdf8"/>
    </g>

    <g transform="translate(34 268)">
      <rect class="barA" x="0" y="10" width="24" height="52" rx="5" fill="#38bdf8"/>
      <rect class="barB" x="42" y="0" width="24" height="62" rx="5" fill="#22d3ee"/>
      <rect class="barC" x="84" y="22" width="24" height="40" rx="5" fill="#818cf8"/>
      <rect class="barA" x="126" y="8" width="24" height="54" rx="5" fill="#38bdf8" opacity="0.8"/>
      <rect class="barB" x="168" y="18" width="24" height="44" rx="5" fill="#22d3ee" opacity="0.8"/>
      <rect class="barC" x="210" y="4" width="24" height="58" rx="5" fill="#818cf8" opacity="0.85"/>
      <rect x="270" y="0" width="148" height="64" rx="14" fill="#020617" stroke="#164e63"/>
      <text class="code" x="288" y="25"><tspan class="key">SELECT</tspan> kpi, status</text>
      <text class="code" x="288" y="47"><tspan class="key">FROM</tspan> recovery_ops<tspan class="blink">_</tspan></text>
    </g>
  </g>

  <path class="dash" d="M306 203C346 203 334 196 372 196" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path class="dash" d="M306 319C342 319 340 294 372 294" stroke="#22d3ee" stroke-width="2" fill="none"/>
  <path class="dash" d="M306 435C348 435 336 386 372 386" stroke="#818cf8" stroke-width="2" fill="none"/>

  <circle class="flowDot1" cx="306" cy="203" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle class="flowDot2" cx="842" cy="338" r="5" fill="#22d3ee" filter="url(#glow)"/>
  <circle class="flowDot3" cx="596" cy="118" r="5" fill="#818cf8" filter="url(#glow)"/>

  <g transform="translate(880 154)" class="floatB" filter="url(#softShadow)">
    <rect width="164" height="74" rx="18" fill="#020617" stroke="#38bdf8"/>
    <text class="tiny" x="20" y="26">INTEGRACOES</text>
    <text class="label" x="20" y="50">APIs + CRM</text>
  </g>

  <g transform="translate(878 260)" class="floatC" filter="url(#softShadow)">
    <rect width="166" height="74" rx="18" fill="#020617" stroke="#22d3ee"/>
    <text class="tiny" x="20" y="26">PROSPECCAO</text>
    <text class="label" x="20" y="50">Automatizada</text>
  </g>

  <g transform="translate(878 366)" class="floatA" filter="url(#softShadow)">
    <rect width="166" height="74" rx="18" fill="#020617" stroke="#818cf8"/>
    <text class="tiny" x="20" y="26">ATENDIMENTO</text>
    <text class="label" x="20" y="50">IA aplicada</text>
  </g>

  <g transform="translate(220 548)">
    <rect width="92" height="30" rx="15" fill="#0f172a" stroke="#38bdf8"/>
    <text class="chip" x="28" y="20">React</text>
    <rect x="104" width="116" height="30" rx="15" fill="#0f172a" stroke="#38bdf8"/>
    <text class="chip" x="127" y="20">TypeScript</text>
    <rect x="232" width="78" height="30" rx="15" fill="#0f172a" stroke="#38bdf8"/>
    <text class="chip" x="257" y="20">SQL</text>
    <rect x="322" width="72" height="30" rx="15" fill="#0f172a" stroke="#38bdf8"/>
    <text class="chip" x="347" y="20">BI</text>
    <rect x="406" width="118" height="30" rx="15" fill="#0f172a" stroke="#38bdf8"/>
    <text class="chip" x="430" y="20">Automation</text>
    <rect x="536" width="82" height="30" rx="15" fill="#0f172a" stroke="#38bdf8"/>
    <text class="chip" x="564" y="20">APIs</text>
    <rect x="630" width="70" height="30" rx="15" fill="#0f172a" stroke="#38bdf8"/>
    <text class="chip" x="654" y="20">AI</text>
  </g>

  <text class="code fadeCycle" x="58" y="588">
    <tspan class="key">mission</tspan>: <tspan class="str">"transformar processos complexos em operacoes escalaveis"</tspan>
  </text>
</svg>
