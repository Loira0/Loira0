<svg width="1000" height="460" viewBox="0 0 1000 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gustavo Henrique professional showcase</title>
  <desc id="desc">Animated showcase focused on automation, data analysis, dashboards and credit recovery operations</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.219 0 0 0 0 0.741 0 0 0 0 0.973 0 0 0 0.65 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
    <style>
      .title { font: 800 32px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .label { font: 800 12px 'Segoe UI', Arial, sans-serif; fill: #38bdf8; letter-spacing: 1.2px; }
      .text { font: 650 14px 'Segoe UI', Arial, sans-serif; fill: #e5e7eb; }
      .small { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .metric { font: 800 24px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .code { font: 500 13px 'Consolas', 'Fira Code', monospace; fill: #dbeafe; }
      .keyword { fill: #38bdf8; }
      .string { fill: #a7f3d0; }
      .number { fill: #facc15; }
      .float { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float2 5s ease-in-out infinite; }
      .pulse { animation: pulse 2.3s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 7s linear infinite; }
      .bar1 { animation: bar1 3s ease-in-out infinite; transform-origin: bottom; }
      .bar2 { animation: bar2 3.4s ease-in-out infinite; transform-origin: bottom; }
      .bar3 { animation: bar3 2.8s ease-in-out infinite; transform-origin: bottom; }
      .dash { stroke-dasharray: 8 10; animation: dash 10s linear infinite; }
      .blink { animation: blink 1.15s steps(2) infinite; }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
      @keyframes float2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(7px)} }
      @keyframes pulse { 0%,100%{opacity:.55;transform:scale(1)} 50%{opacity:1;transform:scale(1.08)} }
      @keyframes scan { 0%{transform:translateX(-1000px)} 100%{transform:translateX(1000px)} }
      @keyframes bar1 { 0%,100%{transform:scaleY(.55)} 50%{transform:scaleY(1)} }
      @keyframes bar2 { 0%,100%{transform:scaleY(.75)} 50%{transform:scaleY(.38)} }
      @keyframes bar3 { 0%,100%{transform:scaleY(.45)} 50%{transform:scaleY(.9)} }
      @keyframes dash { to { stroke-dashoffset: -180; } }
      @keyframes blink { 0%,45%{opacity:1} 46%,100%{opacity:0} }
    </style>
  </defs>

  <rect width="1000" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1000" height="460" rx="28" fill="url(#grid)" opacity="0.5"/>

  <g class="scan" opacity="0.38">
    <rect y="82" width="1000" height="2" fill="url(#scan)"/>
    <rect y="376" width="1000" height="2" fill="url(#scan)"/>
  </g>

  <circle class="float" cx="878" cy="78" r="78" fill="#0369a1" opacity="0.18"/>
  <circle class="float2" cx="126" cy="380" r="96" fill="#38bdf8" opacity="0.1"/>

  <g transform="translate(54 54)">
    <text class="label" x="0" y="0">AUTOMATION / DATA / CREDIT OPERATIONS</text>
    <text class="title" x="0" y="45">Software Developer</text>
    <text class="subtitle" x="0" y="76">Dashboards, automacoes, SQL, integracoes e inteligencia aplicada ao negocio.</text>

    <g transform="translate(0 118)">
      <rect width="282" height="64" rx="16" fill="#020617" stroke="#1e40af"/>
      <circle class="pulse" cx="32" cy="32" r="10" fill="#38bdf8" filter="url(#glow)"/>
      <text class="text" x="58" y="28">Dashboards Gerenciais</text>
      <text class="small" x="58" y="47">React, KPIs, BI, performance</text>
    </g>

    <g transform="translate(0 198)">
      <rect width="282" height="64" rx="16" fill="#020617" stroke="#1e40af"/>
      <circle class="pulse" cx="32" cy="32" r="10" fill="#22d3ee" filter="url(#glow)"/>
      <text class="text" x="58" y="28">Dados e SQL</text>
      <text class="small" x="58" y="47">Consultas, validacao, volume</text>
    </g>

    <g transform="translate(0 278)">
      <rect width="282" height="64" rx="16" fill="#020617" stroke="#1e40af"/>
      <circle class="pulse" cx="32" cy="32" r="10" fill="#818cf8" filter="url(#glow)"/>
      <text class="text" x="58" y="28">Automacao Operacional</text>
      <text class="small" x="58" y="47">Cobranca, CRM, prospeccao</text>
    </g>
  </g>

  <g transform="translate(386 58)" class="float">
    <rect width="562" height="318" rx="20" fill="#020617" stroke="#1e40af"/>
    <rect width="562" height="46" rx="20" fill="#0f172a"/>
    <circle cx="30" cy="23" r="6" fill="#ef4444"/>
    <circle cx="52" cy="23" r="6" fill="#f59e0b"/>
    <circle cx="74" cy="23" r="6" fill="#22c55e"/>
    <text class="small" x="108" y="28">operations-intelligence.dashboard</text>

    <g transform="translate(30 72)">
      <rect width="150" height="86" rx="14" fill="#0f172a" stroke="#164e63"/>
      <text class="small" x="18" y="26">Carteiras monitoradas</text>
      <text class="metric" x="18" y="58">CRM</text>
      <path d="M18 70H132" stroke="#38bdf8" stroke-width="2" opacity="0.65"/>

      <rect x="178" width="150" height="86" rx="14" fill="#0f172a" stroke="#164e63"/>
      <text class="small" x="196" y="26">Dados processados</text>
      <text class="metric" x="196" y="58">SQL</text>
      <path d="M196 70H310" stroke="#22d3ee" stroke-width="2" opacity="0.65"/>

      <rect x="356" width="150" height="86" rx="14" fill="#0f172a" stroke="#164e63"/>
      <text class="small" x="374" y="26">Processos escalaveis</text>
      <text class="metric" x="374" y="58">AUTO</text>
      <path d="M374 70H488" stroke="#818cf8" stroke-width="2" opacity="0.65"/>
    </g>

    <g transform="translate(34 192)">
      <rect width="216" height="78" rx="14" fill="#0f172a" stroke="#164e63"/>
      <text class="small" x="18" y="24">Pipeline operacional</text>
      <path class="dash" d="M24 52H64L84 34L112 58L146 40L190 46" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="64" cy="52" r="5" fill="#38bdf8"/>
      <circle cx="112" cy="58" r="5" fill="#22d3ee"/>
      <circle cx="190" cy="46" r="5" fill="#818cf8"/>
    </g>

    <g transform="translate(282 192)">
      <rect width="224" height="78" rx="14" fill="#0f172a" stroke="#164e63"/>
      <text class="small" x="18" y="24">Indicadores e KPIs</text>
      <rect class="bar1" x="28" y="38" width="22" height="26" rx="4" fill="#38bdf8"/>
      <rect class="bar2" x="68" y="28" width="22" height="36" rx="4" fill="#22d3ee"/>
      <rect class="bar3" x="108" y="44" width="22" height="20" rx="4" fill="#818cf8"/>
      <rect class="bar1" x="148" y="22" width="22" height="42" rx="4" fill="#38bdf8" opacity="0.75"/>
      <rect class="bar2" x="188" y="34" width="22" height="30" rx="4" fill="#22d3ee" opacity="0.75"/>
    </g>
  </g>

  <g transform="translate(382 400)">
    <rect width="88" height="28" rx="14" fill="#0f172a" stroke="#38bdf8"/>
    <text class="small" x="24" y="18">React</text>
    <rect x="98" width="104" height="28" rx="14" fill="#0f172a" stroke="#38bdf8"/>
    <text class="small" x="120" y="18">TypeScript</text>
    <rect x="212" width="72" height="28" rx="14" fill="#0f172a" stroke="#38bdf8"/>
    <text class="small" x="235" y="18">SQL</text>
    <rect x="294" width="74" height="28" rx="14" fill="#0f172a" stroke="#38bdf8"/>
    <text class="small" x="319" y="18">BI</text>
    <rect x="378" width="112" height="28" rx="14" fill="#0f172a" stroke="#38bdf8"/>
    <text class="small" x="402" y="18">Automation</text>
    <rect x="500" width="70" height="28" rx="14" fill="#0f172a" stroke="#38bdf8"/>
    <text class="small" x="524" y="18">AI</text>
  </g>

  <text class="code" x="58" y="424">
    <tspan class="keyword">goal</tspan>: <tspan class="string">"turn complex processes into scalable intelligence"</tspan><tspan class="blink">_</tspan>
  </text>
</svg>
